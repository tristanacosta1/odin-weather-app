<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather App</title>
    </head>
    <body>
        <div id="bg"></div>

        <main id="app">
            <div id="start-view" class="start-view view hidden">
                <label for="place-input">How's the weather in</label>
                <input type="text" id="place-input" name="place" class="place-input" />
                <button type="button" id="search-button" class="search-button">Search</button>
            </div>
            <div id="weather-view" class="weather-view view">
                <section class="current">
                    <div class="temp">16&deg;C</div>
                    <div class="condition">Sunny</div>
                    <div class="details">
                        <div class="sub-details">
                            <div>
                                <div id="wind" class="icon"></div>
                                <div class="text">Wind</div>
                            </div>
                            <div class="value">2.4km/h</div>
                        </div>
                        <div class="sub-details">
                            <div>
                                <div id="humidity" class="icon"></div>
                                <div class="text">Humidity</div>
                            </div>
                            <div class="value">70%</div>
                        </div>
                    </div>
                </section>
                <div class="header">
                    <div id="location" class="icon"></div>
                    <div id="place" class="place">Parañaque, Metro Manila, Philippines</div>
                    <div id="date" class="date">(Monday, July 27)</div>
                </div>
                <section class="daily">
                    <div class="day">
                        <div class="icon"></div>
                        <div class="text">
                            <p>Monday</p>
                            <p>Sunny</p>
                        </div>
                        <p>16&deg;</p>
                    </div>
                    <div class="day">
                        <div class="icon"></div>
                        <div class="text">
                            <p>Monday</p>
                            <p>Sunny</p>
                        </div>
                        <p>16&deg;</p>
                    </div>
                    <div class="day">
                        <div class="icon"></div>
                        <div class="text">
                            <p>Monday</p>
                            <p>Sunny</p>
                        </div>
                        <p>16&deg;</p>
                    </div>
                    <div class="day">
                        <div class="icon"></div>
                        <div class="text">
                            <p>Monday</p>
                            <p>Sunny</p>
                        </div>
                        <p>16&deg;</p>
                    </div>
                    <div class="day">
                        <div class="icon"></div>
                        <div class="text">
                            <p>Monday</p>
                            <p>Sunny</p>
                        </div>
                        <p>16&deg;</p>
                    </div>
                    <div class="day">
                        <div class="icon"></div>
                        <div class="text">
                            <p>Monday</p>
                            <p>Sunny</p>
                        </div>
                        <p>16&deg;</p>
                    </div>
                    <div class="day">
                        <div class="icon"></div>
                        <div class="text">
                            <p>Monday</p>
                            <p>Sunny</p>
                        </div>
                        <p>16&deg;</p>
                    </div>
                </section>
                <section class="hourly"></section>
            </div>
        </main>
    </body>
</html>
